name: Build Teamtrack apps

# Builds in the cloud -- you never install Python or any tools locally.
# Run it two ways:
#   * Actions tab -> "Build Teamtrack apps" -> Run workflow   (files appear as run artifacts)
#   * Push a tag like v1.0  ->  a public Release is created with downloadable files
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tool
        run: pip install pyinstaller

      - name: Build Windows .exe
        if: runner.os == 'Windows'
        run: pyinstaller --onefile --noconsole --name TeamtrackAgent teamtrack_agent.py

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --onefile --windowed --name TeamtrackAgent teamtrack_agent.py
          cd dist && ditto -c -k --keepParent TeamtrackAgent.app TeamtrackAgent-macOS.zip

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TeamtrackAgent-Windows
          path: dist/TeamtrackAgent.exe

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TeamtrackAgent-macOS
          path: dist/TeamtrackAgent-macOS.zip

      - name: Attach Windows build to Release
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TeamtrackAgent.exe

      - name: Attach macOS build to Release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TeamtrackAgent-macOS.zip
